<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOL Simulation</title>
    <link rel="stylesheet" href="../css/main_style.css">
    <link rel="stylesheet" href="../css/style2.css">
</head>
<body>
    <header>
        <ul>
            <li><p><a href="../index.html">Présentation</a></p></li>
            <li><p><a>Simulateur</a></p></li>
        </ul>
    </header>
    <div id="screen-div">
        <canvas id="screen" width="512" height="256">Si vous voyez ceci merci de recharger la page</canvas>
        <div id="param">
            <button type="button" id="start_pause" class="nokeypress imgbutton"></button>
            <button type="button" id="grab_button" class="nokeypress imgbutton"></button>
            <div id="speed_div">
                <input type="range" id="speed" name="ticks/s" min="1" max="100" value="5" class="nokeypress">
                <label for="speed" id="speed_label"></label>
            </div>
            <div id="zoom">
                <input type="button" value="-" id="zoom_minus" class="nokeypress">
                <p id="zoom_p"></p>
                <input type="button" value="+" id="zoom_plus" class="nokeypress">
            </div>
            <input type="file" id="file_input" style="display: none;" accept=".rle">
            <button type="button" id="file_button" class="nokeypress imgbutton"></button>
        </div>
    </div>
    <script src="../javascript/gol.js"></script>
</body>
</html>
